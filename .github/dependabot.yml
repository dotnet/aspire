version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/extension"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/tests/Aspire.Cli.EndToEnd.Tests"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The aspire-video-producer agent skill: the packages of its file-based apps (Directory.Packages.props, for video.cs
  # and the recorder) and the voice's npm package. They run on the user's machine, outside the build, so they follow
  # the latest stable versions.
  - package-ecosystem: "nuget"
    directory: "/.agents/skills/aspire-video-producer/scripts"
    groups:
      aspire-video-producer:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/.agents/skills/aspire-video-producer/scripts/tts"
    groups:
      aspire-video-producer-npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
