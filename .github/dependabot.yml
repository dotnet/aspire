version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/extension"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/tests/Aspire.Cli.EndToEnd.Tests"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The aspire-video-producer agent skill: the packages of its file-based apps (Directory.Packages.props, for video.cs
  # and the recorder), the voice's npm package, and the introduction example's sample app. They run on the user's
  # machine, outside the build, so they follow the latest stable versions.
  - package-ecosystem: "nuget"
    directories:
      - "/.agents/skills/aspire-video-producer/scripts"
      - "/.agents/skills/aspire-video-producer/examples/aspire-introduction/app"
    groups:
      aspire-video-producer:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "/.agents/skills/aspire-video-producer/scripts/tts"
      - "/.agents/skills/aspire-video-producer/examples/aspire-introduction/app"
      - "/.agents/skills/aspire-video-producer/examples/aspire-introduction/app/catalog"
      - "/.agents/skills/aspire-video-producer/examples/aspire-introduction/app/frontend"
    groups:
      aspire-video-producer-npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
