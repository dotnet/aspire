name: Built-in-token non-workflow versus workflow write differential
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare both writes with the same built-in token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo;
            if (`${owner}/${repo}` !== "microsoft/aspire") throw new Error("Wrong repository");
            const receipt = {token_source: "github.token", run_id: context.runId, stages: []};
            const save = () => fs.writeFileSync("/tmp/flaky-token-differential.json", JSON.stringify(receipt, null, 2));
            save();
            const main = await github.rest.git.getRef({owner, repo, ref: "heads/main"});
            receipt.parent = main.data.object.sha;
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: receipt.parent});
            const cases = [
              {name: "non-workflow", path: ".github/flaky-token-capability.json",
               content: JSON.stringify({run_id: context.runId, purpose: "isolated permission probe"})},
              {name: "workflow", path: ".github/workflows/reproduce-flaky-tests.yml"}
            ];
            const workflow = await github.rest.repos.getContent({owner, repo, path: cases[1].path, ref: receipt.parent});
            if (Array.isArray(workflow.data) || workflow.data.type !== "file") throw new Error("No workflow file");
            cases[1].content = Buffer.from(workflow.data.content, "base64").toString("utf8")
              + "\n# Branch-only GITHUB_TOKEN workflow-write capability probe.\n";
            for (const testCase of cases) {
              const stage = {name: testCase.name, path: testCase.path, operation: "create-tree"};
              receipt.stages.push(stage);
              save();
              try {
                const tree = await github.rest.git.createTree({owner, repo, base_tree: parent.data.tree.sha,
                  tree: [{path: testCase.path, mode: "100644", type: "blob", content: testCase.content}]});
                stage.tree = tree.data.sha;
                stage.operation = "create-commit";
                save();
                const commit = await github.rest.git.createCommit({owner, repo, tree: tree.data.sha,
                  parents: [receipt.parent], message: "test(ci): compare built-in-token content permissions\n\n"
                    + "Publish one isolated " + testCase.name + " permission-probe file. Do not change main.\n\n"
                    + "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"});
                stage.commit = commit.data.sha;
                stage.operation = "create-ref";
                stage.reference = `refs/heads/ankj/flaky-investigation-token-${testCase.name}-${context.runId}`;
                save();
                const published = await github.rest.git.createRef({owner, repo, ref: stage.reference, sha: commit.data.sha});
                if (published.data.object.sha !== commit.data.sha) throw new Error("Published ref mismatch");
                stage.published = true;
                save();
              } catch (error) {
                stage.error = {status: error.status, message: error.message};
                save();
                if (error.status !== 403) throw error;
              }
            }
            receipt.main_after = (await github.rest.git.getRef({owner, repo, ref: "heads/main"})).data.object.sha;
            save();
            core.info(JSON.stringify(receipt));
            if (!receipt.stages[0].published) throw new Error("Ordinary content publication also failed");
            if (!receipt.stages[1].published) throw new Error("Confirmed workflow-write boundary with ordinary content publication working");
      - name: Retain both actual permission results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-in-token-write-differential
          path: /tmp/flaky-token-differential.json
          if-no-files-found: error
