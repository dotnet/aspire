name: Existing trusted commit reference permission differential
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record exact existing-commit reference responses
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo;
            if (`${owner}/${repo}` !== "microsoft/aspire") throw new Error("Wrong repository");
            const receipt = {run_id: context.runId, token_source: "github.token", cases: []};
            const save = () => fs.writeFileSync("/tmp/flaky-worker-ref-probe.json", JSON.stringify(receipt, null, 2));
            save();
            receipt.main_before = (await github.rest.git.getRef({owner, repo, ref: "heads/main"})).data.object.sha;
            const cases = [
              ["worker", "a1cdf22f3bc201bc6ab3c4061a72332124d2301d"],
              ["registered-agent", "515cac42dc95f703735d9f6bbe17bf7db879c871"],
              ["baseline", "2015b1f0a997cf68d0582de62c912e3e419d880a"]
            ];
            for (const [name, sha] of cases) {
              const record = {name, sha, ref: `refs/heads/ankj/flaky-investigation-ref-${context.runId}-${name}`};
              receipt.cases.push(record);
              save();
              const commit = await github.rest.git.getCommit({owner, repo, commit_sha: sha});
              if (commit.data.sha !== sha) throw new Error("Commit identity mismatch");
              record.readable = true;
              try {
                const created = await github.rest.git.createRef({owner, repo, ref: record.ref, sha});
                if (created.data.object.sha !== sha) throw new Error("Reference identity mismatch");
                record.created = true;
              } catch (error) {
                record.error = {status: error.status, message: error.message};
                save();
                if (![403, 422].includes(error.status)) throw error;
              }
              save();
            }
            receipt.main_after = (await github.rest.git.getRef({owner, repo, ref: "heads/main"})).data.object.sha;
            save();
            core.info(JSON.stringify(receipt));
            if (receipt.main_before !== receipt.main_after) throw new Error("Main changed during the probe");
      - name: Retain original reference responses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flaky-worker-ref-probe
          path: /tmp/flaky-worker-ref-probe.json
          if-no-files-found: error
