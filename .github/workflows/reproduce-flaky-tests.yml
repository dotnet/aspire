name: Validate Windows native WASM readiness

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    name: Windows x64 managed breakpoints ${{ matrix.index }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3]
    defaults:
      run:
        shell: pwsh
        working-directory: extension
    env:
      NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      MSBUILDTERMINALLOGGER: 'false'
      ARTIFACT_RUN_ID: '38968962842'

    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CLI artifact source
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $artifactHead = (gh api "repos/microsoft/aspire/actions/runs/$env:ARTIFACT_RUN_ID" --jq '.head_sha').Trim()
          $changed = @(git diff --name-only $artifactHead HEAD -- . ':!extension/**' ':!.github/workflows/reproduce-flaky-tests.yml')
          if ($changed.Count -ne 0) { throw "CLI inputs differ from artifact source: $changed" }
          Write-Host "Source: $(git rev-parse HEAD); identical CLI inputs: $artifactHead"
          Write-Host "Native architecture: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install pinned extension tooling
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:COREPACK_HOME = Join-Path $env:RUNNER_TEMP 'corepack'
          "COREPACK_HOME=$env:COREPACK_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content -Raw scripts\corepack-version.txt).Trim()
          npm install --global --force --registry "$env:NPM_REGISTRY" "corepack@$version"
          $npmGlobalBin = (npm prefix --global).Trim()
          $env:PATH = "$npmGlobalBin;$env:PATH"
          $npmGlobalBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          corepack enable
          node scripts\prepareCorepackYarn.mjs
          node scripts\validate-lockfile-registry.cjs
          corepack yarn install --frozen-lockfile --non-interactive

      - name: Download matching CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-native-archives-win-x64
          path: artifacts/cli-archive
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download matching NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets
          path: artifacts/nugets
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download matching Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-nugets-for-win-x64
          path: artifacts/nugets-rid
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Acquire pinned C# debugger prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-PinnedArtifact([string] $Uri, [string] $OutFile, [string] $Hash) {
            Invoke-WebRequest -Uri $Uri -OutFile $OutFile -MaximumRetryCount 3 -RetryIntervalSec 5
            if ((Get-FileHash $OutFile -Algorithm SHA256).Hash -ne $Hash) {
              throw "Checksum mismatch for $OutFile."
            }
          }
          $runtime = Join-Path $env:RUNNER_TEMP 'dotnet-runtime.vsix'
          $csharp = Join-Path $env:RUNNER_TEMP 'csharp-win32-x64.vsix'
          Get-PinnedArtifact 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/vscode-dotnet-runtime/3.1.0/vspackage' $runtime '8e675ffe5f3674430d63e28d2dc05ab40f36c8494e9549e79d3995d721b13f5a'
          Get-PinnedArtifact 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dotnettools/vsextensions/csharp/2.148.23/vspackage?targetPlatform=win32-x64' $csharp '27cf5f0fdcd677f7af61a6d43f2dc75bac7ca2cffa1f29e3262b615bbcabb952'
          "ASPIRE_EXTENSION_E2E_DOTNET_RUNTIME_VSIX=$runtime" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASPIRE_EXTENSION_E2E_CSHARP_VSIX=$csharp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare matching CLI and packages
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Get-ChildItem ..\artifacts\cli-archive -Recurse -File -Filter 'aspire-cli-win-x64*.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'CLI archive missing.' }
          $bundle = Join-Path (Resolve-Path ..).Path 'artifacts\bundle\win-x64'
          New-Item -ItemType Directory $bundle -Force | Out-Null
          Expand-Archive $archive.FullName -DestinationPath $bundle
          $cli = Get-ChildItem $bundle -Recurse -File -Filter aspire.exe | Select-Object -First 1
          if ($null -eq $cli) { throw 'Extracted CLI missing.' }
          & $cli.FullName setup
          $installPath = Split-Path (Split-Path $cli.FullName -Parent) -Parent
          $dcp = Get-ChildItem $installPath -Recurse -File -Filter dcp.exe | Select-Object -First 1
          if ($null -eq $dcp) { throw 'CLI setup did not produce DCP.' }
          $packages = Get-ChildItem ..\artifacts\nugets -Recurse -File -Filter '*.nupkg'
          $sample = $packages | Where-Object Name -Like 'Aspire.Hosting.AppHost.*.nupkg' | Select-Object -First 1
          if ($null -eq $sample) { throw 'AppHost package missing.' }
          $version = $sample.Name -replace '^Aspire\.Hosting\.AppHost\.', '' -replace '\.nupkg$', ''
          $hive = Join-Path $env:RUNNER_TEMP 'validation-packages'
          New-Item -ItemType Directory $hive -Force | Out-Null
          $packages | Copy-Item -Destination $hive
          Get-ChildItem ..\artifacts\nugets-rid -Recurse -File -Filter '*.nupkg' | Copy-Item -Destination $hive -Force
          @(
            "ASPIRE_DCP_PATH=$($dcp.Directory.FullName)"
            "ASPIRE_CLI_PACKAGES=$hive"
            "ASPIRE_EXTENSION_E2E_CLI_PATH=$($cli.FullName)"
            "ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION=$version"
          ) | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $cli.FullName --version

      - name: Build extension and actual E2E tests
        env:
          ASPIRE_EXTENSION_E2E_INCLUDE_BRIDGE: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn compile-e2e
          corepack yarn run vsce package --pre-release -o out\aspire-extension.vsix

      - name: Require all eight tests and three native breakpoint proofs
        env:
          ASPIRE_EXTENSION_E2E_SHARD: browser-debugger
          ASPIRE_EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/browserDebugger.e2e.test.js
          ASPIRE_EXTENSION_E2E_BROWSER: msedge
          ASPIRE_EXTENSION_E2E_RECORDING_MODE: 'off'
          ASPIRE_EXTENSION_E2E_ADVISORY_ISSUE: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ASPIRE_EXTENSION_E2E_VSIX = Join-Path (Get-Location) 'out\aspire-extension.vsix'
          node scripts\run-e2e.js
          $testExit = $LASTEXITCODE
          $results = '.test-results\e2e\browser-debugger'
          $mocha = Get-Content -Raw "$results\mocha.json" | ConvertFrom-Json
          $mocha.stats | ConvertTo-Json -Compress
          if ($testExit -ne 0 -or $mocha.stats.tests -ne 8 -or $mocha.stats.passes -ne 8 -or $mocha.stats.pending -ne 0 -or $mocha.stats.failures -ne 0) {
            throw "Eight actual passing tests required; runner exit $testExit."
          }
          foreach ($name in @('standalone', 'hosted-global', 'hosted-per-page')) {
            $proof = Get-Content -Raw "$results\blazor-$name-proof.json" | ConvertFrom-Json
            if ($proof.managedSession.type -ne 'monovsdbg_wasm') { throw "Native backend required for $name." }
            if ($proof.rootSession.configuration.inspectUri -notmatch '^ws://127\.0\.0\.1:\d+/[0-9a-f-]+\{browserInspectUriPath\}$') { throw "Relay required for $name." }
            if ($proof.proof -ne 'blazor-wasm-managed-breakpoint-hit' -or $proof.stoppedEvent.reason -ne 'breakpoint') { throw "Managed breakpoint required for $name." }
            Write-Host "$name : native managed breakpoint through launch-owned relay"
          }

      - name: Preserve all diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-readiness-${{ matrix.index }}-attempt${{ github.run_attempt }}
          path: |
            extension/.test-results/**
            extension/.test-storage/**
            extension/.test-workspaces/**
          include-hidden-files: true
          if-no-files-found: warn
