name: Flaky investigation agent validation
run-name: "Flaky investigation agent: ${{ inputs.issue_url }}"
on:
  workflow_dispatch:
    inputs:
      issue_url:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      state_revision:
        required: true
        type: string
permissions:
  actions: read
  contents: write
  issues: write
  copilot-requests: write
jobs:
  investigate:
    uses: ./.github/workflows/flaky-test-investigator.lock.yml
    with:
      issue_url: ${{ inputs.issue_url }}
      issue_number: ${{ inputs.issue_number }}
      state_revision: ${{ inputs.state_revision }}
