name: Flaky investigation controller validation
run-name: "Flaky investigation ${{ inputs.operation }}: ${{ inputs.issue_url }}"
on:
  workflow_dispatch:
    inputs:
      issue_url:
        required: true
        type: string
      operation:
        required: true
        type: choice
        options: [start, resume, cancel]
        default: start
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: flaky-investigation-upstream-${{ inputs.issue_url }}
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Advance and hand off to another hosted controller run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ inputs.issue_url }}
          OPERATION: ${{ inputs.operation }}
          FLAKY_AGENT_WORKFLOW: reproduce-flaky-tests.yml
          FLAKY_AGENT_SHA: "515cac42dc95f703735d9f6bbe17bf7db879c871"
          FLAKY_WORKER_SHA: "a1cdf22f3bc201bc6ab3c4061a72332124d2301d"
        run: python3 .github/scripts/flaky-investigation-upstream-driver.py
