# Reproduces flaky tests by running them repeatedly across multiple OS runners.
#
# HOW TO USE:
# 1. Edit the CONFIGURATION section below with the test you want to reproduce
# 2. Push to your branch
# 3. Trigger: gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <your-branch>
# 4. Check the results across OSes and runners
#
# The configuration is designed to be edited by agents (Copilot, etc.)
# who modify the env vars below and push to trigger a run.

name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

# ============================================================
# CONFIGURATION — Edit these values to customize the test run
# ============================================================
env:
  # Test project shortname (maps to tests/Aspire.{name}.Tests/ or tests/{name}.Tests/)
  # Examples: Hosting, Core, Dashboard, Components.Common, Cli.EndToEnd
  TEST_PROJECT: "Hosting"

  # Test filter arguments passed to dotnet test (after the -- separator).
  # Use quotes around wildcard patterns to prevent shell glob expansion.
  # Examples:
  #   --filter-method "*.TestMethodName"
  #   --filter-class "*.TestClassName"
  #   --filter-method "*.Test1" --filter-method "*.Test2"
  TEST_FILTER: '--filter-method "*.YourTestMethodName"'

  # Target operating systems (comma-separated)
  # Options: ubuntu-latest, windows-latest, macos-latest
  TARGET_OSES: "ubuntu-latest,windows-latest"

  # Number of parallel runners per OS
  # Total jobs = RUNNERS_PER_OS × number of OSes (must be ≤ 256)
  RUNNERS_PER_OS: "3"

  # Number of test iterations each runner executes
  ITERATIONS_PER_RUNNER: "3"

jobs:

  validate_java_starter:
    name: Java starter on macOS (${{ matrix.code }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        code: [stable, insider]
    permissions:
      contents: read
      actions: read
    env:
      MSBUILDTERMINALLOGGER: "false"
      NPM_REGISTRY: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-npm/npm/registry/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      ASPIRE_CLI_TELEMETRY_OPTOUT: "true"
      ASPIRE_EXTENSION_E2E_SHARD: java-starter-macos-${{ matrix.code }}
      ASPIRE_EXTENSION_E2E_SPEC: out/test-e2e/test-e2e/javaStarterProjectModel.e2e.test.js
      ASPIRE_EXTENSION_E2E_SKIP_CURRENT_CLI_REGRESSIONS: "false"
      ASPIRE_EXTENSION_E2E_APPHOST_SDK_VERSION: 17.0.0-ci
      # ExTester's native launch must retain setup-java's JDK instead of the login-shell PATH.
      # https://github.com/microsoft/vscode/blob/1.130.0/src/vs/platform/shell/node/shellEnv.ts
      VSCODE_CLI: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Download matching native CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 38792981238
          name: cli-native-archives-osx-arm64
          path: artifacts/validation-native-cli
      - name: Download matching packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 38792981238
          name: built-nugets
          path: artifacts/nugets
      - name: Download matching runtime packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 38792981238
          name: built-nugets-for-osx-arm64
          path: artifacts/nugets-rid
      - name: Prepare a genuine native payload for the source-built CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifacts/validation-native-cli -type f -name 'aspire-cli-osx-arm64*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/java-native-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/java-native-cli"
          cli="$(find "$RUNNER_TEMP/java-native-cli" -type f -name aspire -print -quit)"
          test -n "$cli"
          chmod +x "$cli"
          ASPIRE_LAYOUT_PATH="$RUNNER_TEMP/java-native-layout" ASPIRE_HOME="$RUNNER_TEMP/java-native-home" "$cli" setup --install-path "$RUNNER_TEMP/java-native-layout"
          bundle="$RUNNER_TEMP/java-native-layout/bundle"
          test -x "$bundle/dcp/dcp"
          test -x "$bundle/dashboard/Aspire.Dashboard"
          test -x "$bundle/managed/aspire-managed"
          mkdir -p "$RUNNER_TEMP/java-source-payload/osx-arm64"
          cp -R "$bundle/." "$RUNNER_TEMP/java-source-payload/osx-arm64/"
          tar -czf "$RUNNER_TEMP/java-source-payload.tar.gz" -C "$RUNNER_TEMP/java-source-payload" osx-arm64
          hive="$HOME/.aspire/hives/daily/packages"
          mkdir -p "$hive"
          find artifacts/nugets artifacts/nugets-rid -type f -name '*.nupkg' -exec cp {} "$hive/" \;
          {
            echo "BundlePayloadPath=$RUNNER_TEMP/java-source-payload.tar.gz"
            echo "ASPIRE_DCP_PATH=$bundle/dcp"
            echo "ASPIRE_DASHBOARD_PATH=$bundle/dashboard/Aspire.Dashboard"
            echo "ASPIRE_CLI_PACKAGES=$hive"
            echo "ASPIRE_LAYOUT_PATH=$RUNNER_TEMP/java-native-layout"
          } >> "$GITHUB_ENV"
      - name: Restore the source CLI
        run: ./restore.sh --projects "${{ github.workspace }}/src/Aspire.Cli/Aspire.Cli.csproj"
      - name: Build the current source CLI with the genuine native bundle
        run: |
          dotnet build src/Aspire.Cli/Aspire.Cli.csproj --verbosity quiet /p:SkipNativeBuild=true "/p:BundlePayloadPath=$BundlePayloadPath"
          cli="$GITHUB_WORKSPACE/artifacts/bin/Aspire.Cli/Debug/net11.0/aspire"
          test -x "$cli"
          echo "ASPIRE_EXTENSION_E2E_CLI_PATH=$cli" >> "$GITHUB_ENV"
      - name: Validate generated Java and physical transport
        run: >-
          dotnet test --project tests/Aspire.Hosting.CodeGeneration.Java.Tests/Aspire.Hosting.CodeGeneration.Java.Tests.csproj
          --no-launch-profile --verbosity quiet --
          --filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true"
      - name: Prepare pinned Yarn and extension dependencies
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          required="$(cat scripts/corepack-version.txt)"
          if ! command -v corepack >/dev/null || [ "$(corepack --version)" != "$required" ]; then
            npm install --global --force --registry "$NPM_REGISTRY" "corepack@$required"
          fi
          corepack enable
          node scripts/prepareCorepackYarn.mjs
          if [ ! -d node_modules ]; then
            corepack yarn install --frozen-lockfile --non-interactive
          fi
          corepack yarn compile-e2e
      - name: Download Java language and debug extensions
        shell: bash
        run: |
          set -euo pipefail
          language="$RUNNER_TEMP/redhat-java-1.55.0.vsix"
          debug="$RUNNER_TEMP/vscjava-java-debug-0.59.0.vsix"
          dependency="$RUNNER_TEMP/vscjava-java-dependency-0.27.6.vsix"
          curl --fail --location --compressed --retry 3 --output "$language" 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/redhat/vsextensions/java/1.55.0/vspackage'
          curl --fail --location --compressed --retry 3 --output "$debug" 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-debug/0.59.0/vspackage'
          curl --fail --location --compressed --retry 3 --output "$dependency" 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-dependency/0.27.6/vspackage'
          printf '%s  %s\n' 011639c3ee347b9591895bfc77d8cf28f836c053d0a49ae4a83efe9dc473a603 "$language" | shasum -a 256 --check -
          printf '%s  %s\n' e5973fcd763a984ea4d6e57644ccf8f5fe6caa80c0e589f29403f00c9ace3920 "$debug" | shasum -a 256 --check -
          printf '%s  %s\n' e4e7c8b90953e62c8ebcedaaafb88b3c42ddec3fcc9e37f268ac3203427d9fa0 "$dependency" | shasum -a 256 --check -
          echo "ASPIRE_EXTENSION_E2E_JAVA_VSIX=$language:$debug:$dependency" >> "$GITHUB_ENV"
      - name: Download and verify genuine pinned VS Code Insiders
        if: ${{ matrix.code == 'insider' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/java-vscode-insiders.zip"
          curl --fail --location --retry 3 --output "$archive" 'https://vscode.download.prss.microsoft.com/dbazure/download/insider/58173d0ebc1838579e3c331e0a47e365904a6456/VSCode-darwin-arm64.zip'
          printf '%s  %s\n' e1da948b68906b38d5baefbf09147457542dcef364d03431d720c4d3e3640276 "$archive" | shasum -a 256 --check -
          mkdir -p "$RUNNER_TEMP/java-vscode-insiders"
          ditto -x -k "$archive" "$RUNNER_TEMP/java-vscode-insiders"
          app="$RUNNER_TEMP/java-vscode-insiders/Visual Studio Code - Insiders.app"
          test -x "$app/Contents/MacOS/Code - Insiders"
          /usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist"
          echo "ASPIRE_JAVA_VALIDATION_INSIDERS_DIR=$app" >> "$GITHUB_ENV"
      - name: Exercise semantic imports and the complete Java starter runtime
        working-directory: extension
        run: |
          set -euo pipefail
          command -v java
          command -v javac
          java -version
          javac -version
          corepack yarn node scripts/run-e2e.js
      - name: Upload editor and runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-starter-macos-${{ matrix.code }}
          path: |
            extension/.test-results/e2e/java-starter-macos-${{ matrix.code }}
            extension/.test-storage/java-starter-macos-${{ matrix.code }}
            extension/.test-workspaces/java-starter-macos-${{ matrix.code }}
          if-no-files-found: warn
          retention-days: 7

  setup:
    name: Generate matrix
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      is_cli_e2e: ${{ steps.detect_cli_e2e.outputs.is_cli_e2e }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          ERRORS=0

          # Validate RUNNERS_PER_OS is a positive integer
          if ! [[ "${{ env.RUNNERS_PER_OS }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RUNNERS_PER_OS must be a positive integer, got '${{ env.RUNNERS_PER_OS }}'"
            ERRORS=1
          fi

          # Validate ITERATIONS_PER_RUNNER is a positive integer
          if ! [[ "${{ env.ITERATIONS_PER_RUNNER }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ITERATIONS_PER_RUNNER must be a positive integer, got '${{ env.ITERATIONS_PER_RUNNER }}'"
            ERRORS=1
          fi

          # Validate TARGET_OSES is not empty and contains only known runners
          if [[ -z "${{ env.TARGET_OSES }}" ]]; then
            echo "::error::TARGET_OSES must not be empty"
            ERRORS=1
          else
            IFS=',' read -ra CHECK_OSES <<< "${{ env.TARGET_OSES }}"
            for os in "${CHECK_OSES[@]}"; do
              os=$(echo "$os" | xargs)
              if [[ "$os" != "ubuntu-latest" && "$os" != "windows-latest" && "$os" != "macos-latest" ]]; then
                echo "::error::Unknown OS in TARGET_OSES: '$os'. Allowed: ubuntu-latest, windows-latest, macos-latest"
                ERRORS=1
              fi
            done
          fi

          # Validate TEST_FILTER is not the placeholder
          if [[ "${{ env.TEST_FILTER }}" == *"YourTestMethodName"* ]]; then
            echo "::error::TEST_FILTER still contains the placeholder 'YourTestMethodName'. Configure it with the actual test to reproduce."
            ERRORS=1
          fi

          if [[ $ERRORS -ne 0 ]]; then exit 1; fi

      - name: Detect CLI E2E project
        id: detect_cli_e2e
        shell: bash
        run: |
          if [ "${{ env.TEST_PROJECT }}" = "Cli.EndToEnd" ]; then
            echo "is_cli_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_cli_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate runner matrix
        id: generate
        shell: bash
        run: |
          IFS=',' read -ra OSES <<< "${{ env.TARGET_OSES }}"
          RUNNERS=${{ env.RUNNERS_PER_OS }}

          ENTRIES=""
          for os in "${OSES[@]}"; do
            os=$(echo "$os" | xargs)
            for i in $(seq 1 "$RUNNERS"); do
              if [ -n "$ENTRIES" ]; then ENTRIES="$ENTRIES,"; fi
              ENTRIES="${ENTRIES}{\"os\":\"${os}\",\"index\":${i}}"
            done
          done

          MATRIX="{\"include\":[${ENTRIES}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          TOTAL=$(echo "$ENTRIES" | tr ',' '\n' | wc -l)
          echo "Generated matrix: $TOTAL runners across ${#OSES[@]} OS(es)"
          echo "Each runner will execute ${{ env.ITERATIONS_PER_RUNNER }} iterations"
          echo "Total test executions: $(( TOTAL * ${{ env.ITERATIONS_PER_RUNNER }} ))"

  build_cli_e2e_image:
    name: Build CLI E2E Docker image
    needs: setup
    if: ${{ github.repository == 'microsoft/aspire' && needs.setup.outputs.is_cli_e2e == 'true' }}
    uses: ./.github/workflows/build-cli-e2e-image.yml

  reproduce:
    name: "${{ matrix.os }} #${{ matrix.index }}"
    needs: [setup, build_cli_e2e_image]
    if: >-
      ${{
        github.repository == 'microsoft/aspire' &&
        !cancelled() &&
        needs.setup.result == 'success' &&
        (needs.build_cli_e2e_image.result == 'success' || needs.build_cli_e2e_image.result == 'skipped')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet

    steps:
      - name: Setup vars (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "DOTNET_SCRIPT=./dotnet.sh" >> $GITHUB_ENV
          echo "BUILD_SCRIPT=./build.sh" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Setup vars (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DOTNET_SCRIPT=.\dotnet.cmd" >> $env:GITHUB_ENV
          echo "BUILD_SCRIPT=.\build.cmd" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}\.dotnet" >> $env:GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust HTTPS development certificate (Linux)
        if: runner.os == 'Linux'
        run: |
          EXIT_CODE=0
          ${{ env.DOTNET_SCRIPT }} dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
          WSL_INTEROP: ""

      - name: Verify Docker is running (Linux)
        if: runner.os == 'Linux'
        run: docker info

      - name: Download prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-dotnet-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E Java Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-java-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E polyglot Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Load prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          eng/scripts/load-cli-e2e-images.sh \
            --image-dir "${{ github.workspace }}/cli-e2e-image" \
            --require-dotnet true \
            --require-polyglot true \
            --require-java true

      - name: Unlock macOS keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/unlock-macos-keychain

      - name: Compute test project path
        shell: pwsh
        run: |
          $testShortName = "${{ env.TEST_PROJECT }}"
          $projectPath1 = "${{ github.workspace }}/tests/$testShortName.Tests/$testShortName.Tests.csproj"
          $projectPath2 = "${{ github.workspace }}/tests/Aspire.$testShortName.Tests/Aspire.$testShortName.Tests.csproj"

          if (Test-Path -Path $projectPath1) {
              $projectPath = $projectPath1
          } elseif (Test-Path -Path $projectPath2) {
              $projectPath = $projectPath2
          } else {
              Write-Error "No test project found for shortname '$testShortName'. Looked at: $projectPath1, $projectPath2"
              exit 1
          }

          echo "TEST_PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
          Write-Host "Resolved test project: $projectPath"

      - name: Build test project
        run: >
          ${{ env.BUILD_SCRIPT }}
          -restore -ci -build
          -projects ${{ env.TEST_PROJECT_PATH }}
          /p:InstallBrowsersForPlaywright=false
          /p:RunQuarantinedTests=true

      - name: Run test iterations (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
        run: |
          PASS=0
          FAIL=0
          ITERATIONS=${{ env.ITERATIONS_PER_RUNNER }}

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Iteration $i/$ITERATIONS"

            # Cleanup between iterations
            rm -rf "${{ github.workspace }}/testresults" 2>/dev/null || true
            pgrep -lf "dcp" 2>/dev/null | grep -E "\bdcp(\.exe|ctl)?\b" | awk '{print $1}' | while read pid; do
              kill -9 "$pid" 2>/dev/null || true
            done
            sleep 1

            # Run test (capture output for zero-test detection)
            ITER_OUTPUT="${{ github.workspace }}/iter-output-$i.log"
            set +e  # Disable errexit so pipefail doesn't abort before PIPESTATUS capture
            ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" \
              --no-restore \
              --no-build \
              -- \
              --timeout 10m \
              --results-directory "${{ github.workspace }}/testresults" \
              ${{ env.TEST_FILTER }} \
              2>&1 | tee "$ITER_OUTPUT"
            RESULT=${PIPESTATUS[0]}
            set -e

            # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
            if [ "$RESULT" -eq 0 ]; then
              if ! grep -qiE "total:\s*[1-9]" "$ITER_OUTPUT" 2>/dev/null; then
                echo "::error::Iteration $i: Zero tests executed. Verify TEST_FILTER and quarantine settings."
                RESULT=8
              fi
            fi
            rm -f "$ITER_OUTPUT"

            if [ "$RESULT" -eq 0 ]; then
              echo "✅ Iteration $i: PASS"
              PASS=$((PASS + 1))
            else
              echo "❌ Iteration $i: FAIL (exit $RESULT)"
              FAIL=$((FAIL + 1))
              mkdir -p "${{ github.workspace }}/all-results/failure-$i"
              cp -r "${{ github.workspace }}/testresults/"* "${{ github.workspace }}/all-results/failure-$i/" 2>/dev/null || true
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "========================================"
          echo "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          echo "  Passed: $PASS / $ITERATIONS"
          echo "  Failed: $FAIL / $ITERATIONS"
          echo "========================================"

          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Run test iterations (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
        run: |
          $pass = 0
          $fail = 0
          $iterations = [int]"${{ env.ITERATIONS_PER_RUNNER }}"

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "::group::Iteration $i/$iterations"

            # Cleanup between iterations
            Remove-Item -Recurse -Force "${{ github.workspace }}/testresults" -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match '^dcp' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1

            # Run test (capture output for zero-test detection)
            $iterOutput = Join-Path "${{ github.workspace }}" "iter-output-$i.log"
            & ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" `
              --no-restore `
              --no-build `
              -- `
              --timeout 10m `
              --results-directory "${{ github.workspace }}/testresults" `
              ${{ env.TEST_FILTER }} *> $iterOutput
            $result = $LASTEXITCODE
            Get-Content $iterOutput

            # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
            if ($result -eq 0) {
              $content = Get-Content $iterOutput -Raw -ErrorAction SilentlyContinue
              if (-not ($content -match '(?i)total:\s*[1-9]')) {
                Write-Host "::error::Iteration ${i}: Zero tests executed. Verify TEST_FILTER and quarantine settings."
                $result = 8
              }
            }
            Remove-Item $iterOutput -ErrorAction SilentlyContinue

            if ($result -eq 0) {
              Write-Host "✅ Iteration ${i}: PASS"
              $pass++
            } else {
              Write-Host "❌ Iteration ${i}: FAIL (exit $result)"
              $fail++
              $dest = "${{ github.workspace }}/all-results/failure-$i"
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              Copy-Item -Recurse "${{ github.workspace }}/testresults/*" $dest -ErrorAction SilentlyContinue
            }

            Write-Host "::endgroup::"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          Write-Host "  Passed: $pass / $iterations"
          Write-Host "  Failed: $fail / $iterations"
          Write-Host "========================================"

          if ($fail -gt 0) { exit 1 }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.os }}-${{ matrix.index }}
          path: all-results/
          if-no-files-found: ignore

  results:
    if: ${{ false }}
    runs-on: ubuntu-latest
    name: Reproduce Results
    needs: [reproduce]
    permissions: {}
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "## Reproduce Flaky Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Project | \`${{ env.TEST_PROJECT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Filter | \`${{ env.TEST_FILTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| OSes | ${{ env.TARGET_OSES }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runners per OS | ${{ env.RUNNERS_PER_OS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Iterations per runner | ${{ env.ITERATIONS_PER_RUNNER }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.reproduce.result }}" = "success" ]; then
            echo "### ✅ All iterations passed on all runners" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.reproduce.result }}" = "failure" ]; then
            echo "### ❌ Some runners reported failures" >> $GITHUB_STEP_SUMMARY
            echo "Check individual job logs and uploaded failure artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Reproduce job was ${{ needs.reproduce.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if reproduce did not succeed
        if: ${{ needs.reproduce.result != 'success' }}
        run: exit 1
