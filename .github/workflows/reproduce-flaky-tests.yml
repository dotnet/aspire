# Reproduces flaky tests by running them repeatedly across multiple OS runners.
#
# HOW TO USE:
# 1. Edit the CONFIGURATION section below with the test you want to reproduce
# 2. Push to your branch
# 3. Trigger: gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <your-branch>
# 4. Check the results across OSes and runners
#
# The configuration is designed to be edited by agents (Copilot, etc.)
# who modify the env vars below and push to trigger a run.

name: Reproduce Flaky Tests

on:
  workflow_dispatch: {}

# ============================================================
# CONFIGURATION — Edit these values to customize the test run
# ============================================================
env:
  # Test project shortname (maps to tests/Aspire.{name}.Tests/ or tests/{name}.Tests/)
  # Examples: Hosting, Core, Dashboard, Components.Common, Cli.EndToEnd
  TEST_PROJECT: "Cli"

  # Test filter arguments passed to dotnet test (after the -- separator).
  # Use quotes around wildcard patterns to prevent shell glob expansion.
  # Examples:
  #   --filter-method "*.TestMethodName"
  #   --filter-class "*.TestClassName"
  #   --filter-method "*.Test1" --filter-method "*.Test2"
  TEST_FILTER: '--filter-not-trait "quarantined=true" --filter-not-trait "outerloop=true" --filter-not-trait "category=failing"'

  # Target operating systems (comma-separated)
  # Options: ubuntu-latest, windows-latest, macos-latest
  TARGET_OSES: "macos-latest"

  # Number of parallel runners per OS
  # Total jobs = RUNNERS_PER_OS × number of OSes (must be ≤ 256)
  RUNNERS_PER_OS: "3"

  # Number of test iterations each runner executes
  ITERATIONS_PER_RUNNER: "1"

jobs:

  setup:
    name: Generate matrix
    if: ${{ github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      is_cli_e2e: ${{ steps.detect_cli_e2e.outputs.is_cli_e2e }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          ERRORS=0

          # Validate RUNNERS_PER_OS is a positive integer
          if ! [[ "${{ env.RUNNERS_PER_OS }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RUNNERS_PER_OS must be a positive integer, got '${{ env.RUNNERS_PER_OS }}'"
            ERRORS=1
          fi

          # Validate ITERATIONS_PER_RUNNER is a positive integer
          if ! [[ "${{ env.ITERATIONS_PER_RUNNER }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ITERATIONS_PER_RUNNER must be a positive integer, got '${{ env.ITERATIONS_PER_RUNNER }}'"
            ERRORS=1
          fi

          # Validate TARGET_OSES is not empty and contains only known runners
          if [[ -z "${{ env.TARGET_OSES }}" ]]; then
            echo "::error::TARGET_OSES must not be empty"
            ERRORS=1
          else
            IFS=',' read -ra CHECK_OSES <<< "${{ env.TARGET_OSES }}"
            for os in "${CHECK_OSES[@]}"; do
              os=$(echo "$os" | xargs)
              if [[ "$os" != "ubuntu-latest" && "$os" != "windows-latest" && "$os" != "macos-latest" ]]; then
                echo "::error::Unknown OS in TARGET_OSES: '$os'. Allowed: ubuntu-latest, windows-latest, macos-latest"
                ERRORS=1
              fi
            done
          fi

          # Validate TEST_FILTER is not the placeholder
          if [[ "${{ env.TEST_FILTER }}" == *"YourTestMethodName"* ]]; then
            echo "::error::TEST_FILTER still contains the placeholder 'YourTestMethodName'. Configure it with the actual test to reproduce."
            ERRORS=1
          fi

          if [[ $ERRORS -ne 0 ]]; then exit 1; fi

      - name: Detect CLI E2E project
        id: detect_cli_e2e
        shell: bash
        run: |
          if [ "${{ env.TEST_PROJECT }}" = "Cli.EndToEnd" ]; then
            echo "is_cli_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_cli_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate runner matrix
        id: generate
        shell: bash
        run: |
          IFS=',' read -ra OSES <<< "${{ env.TARGET_OSES }}"
          RUNNERS=${{ env.RUNNERS_PER_OS }}

          ENTRIES=""
          for os in "${OSES[@]}"; do
            os=$(echo "$os" | xargs)
            for i in $(seq 1 "$RUNNERS"); do
              if [ -n "$ENTRIES" ]; then ENTRIES="$ENTRIES,"; fi
              ENTRIES="${ENTRIES}{\"os\":\"${os}\",\"index\":${i}}"
            done
          done

          MATRIX="{\"include\":[${ENTRIES}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          TOTAL=$(echo "$ENTRIES" | tr ',' '\n' | wc -l)
          echo "Generated matrix: $TOTAL runners across ${#OSES[@]} OS(es)"
          echo "Each runner will execute ${{ env.ITERATIONS_PER_RUNNER }} iterations"
          echo "Total test executions: $(( TOTAL * ${{ env.ITERATIONS_PER_RUNNER }} ))"

  build_cli_e2e_image:
    name: Build CLI E2E Docker image
    needs: setup
    if: ${{ github.repository == 'microsoft/aspire' && needs.setup.outputs.is_cli_e2e == 'true' }}
    uses: ./.github/workflows/build-cli-e2e-image.yml

  reproduce:
    name: "${{ matrix.os }} #${{ matrix.index }}"
    needs: [setup, build_cli_e2e_image]
    if: >-
      ${{
        github.repository == 'microsoft/aspire' &&
        !cancelled() &&
        needs.setup.result == 'success' &&
        (needs.build_cli_e2e_image.result == 'success' || needs.build_cli_e2e_image.result == 'skipped')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet

    steps:
      - name: Setup vars (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "DOTNET_SCRIPT=./dotnet.sh" >> $GITHUB_ENV
          echo "BUILD_SCRIPT=./build.sh" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Setup vars (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DOTNET_SCRIPT=.\dotnet.cmd" >> $env:GITHUB_ENV
          echo "BUILD_SCRIPT=.\build.cmd" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}\.dotnet" >> $env:GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust HTTPS development certificate (Linux)
        if: runner.os == 'Linux'
        run: |
          EXIT_CODE=0
          ${{ env.DOTNET_SCRIPT }} dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
          WSL_INTEROP: ""

      - name: Verify Docker is running (Linux)
        if: runner.os == 'Linux'
        run: docker info

      - name: Download prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-dotnet-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E Java Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-java-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E polyglot Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Load prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          eng/scripts/load-cli-e2e-images.sh \
            --image-dir "${{ github.workspace }}/cli-e2e-image" \
            --require-dotnet true \
            --require-polyglot true \
            --require-java true

      - name: Unlock macOS keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/unlock-macos-keychain

      - name: Compute test project path
        shell: pwsh
        run: |
          $testShortName = "${{ env.TEST_PROJECT }}"
          $projectPath1 = "${{ github.workspace }}/tests/$testShortName.Tests/$testShortName.Tests.csproj"
          $projectPath2 = "${{ github.workspace }}/tests/Aspire.$testShortName.Tests/Aspire.$testShortName.Tests.csproj"

          if (Test-Path -Path $projectPath1) {
              $projectPath = $projectPath1
          } elseif (Test-Path -Path $projectPath2) {
              $projectPath = $projectPath2
          } else {
              Write-Error "No test project found for shortname '$testShortName'. Looked at: $projectPath1, $projectPath2"
              exit 1
          }

          echo "TEST_PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
          Write-Host "Resolved test project: $projectPath"

      - name: Build test project
        env:
          ASPIRE_CLI_NUGET_SERVICE_INDEX: https://packagefeedproxy.microsoft.io/nuget/v3/index.json
        run: >
          ${{ env.BUILD_SCRIPT }}
          -restore -ci -build
          -projects ${{ env.TEST_PROJECT_PATH }}
          /p:InstallBrowsersForPlaywright=false
          /p:RunQuarantinedTests=false

      - name: Acquire daily SDK and record comparison inputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p all-results
          CANDIDATE_ROOT=$(mktemp -d "${RUNNER_TEMP}/aspire-daily-sdk.XXXXXX")
          ARCHIVE="$CANDIDATE_ROOT/sdk.tar.gz"
          # Pin the daily alias's resolved archive so all paired runners use identical bits.
          DAILY_URL="https://ci.dot.net/public/Sdk/11.0.100-rtm.26520.139/dotnet-sdk-11.0.100-osx-arm64.tar.gz"
          CHECKSUM_URL="https://ci.dot.net/public-checksums/Sdk/11.0.100-rtm.26520.139/dotnet-sdk-11.0.100-osx-arm64.tar.gz.sha512"
          curl --fail --location --retry 3 "$DAILY_URL" --output "$ARCHIVE" \
            --write-out '%{url_effective}\n' > all-results/sdk-download-url.txt
          curl --fail --location --retry 3 "$CHECKSUM_URL" --output "$CANDIDATE_ROOT/sdk.sha512"
          cp "$CANDIDATE_ROOT/sdk.sha512" all-results/candidate-sdk.sha512
          EXPECTED=$(awk '{print $1}' "$CANDIDATE_ROOT/sdk.sha512")
          printf '%s  %s\n' "$EXPECTED" "$ARCHIVE" | shasum -a 512 -c -
          tar -xzf "$ARCHIVE" -C "$CANDIDATE_ROOT"
          rm "$ARCHIVE"
          (cd "$CANDIDATE_ROOT" && ./dotnet --info) > all-results/candidate-dotnet-info.txt
          "$CANDIDATE_ROOT/dotnet" --list-sdks > all-results/candidate-sdks.txt
          "$DOTNET_ROOT/dotnet" --info > all-results/baseline-dotnet-info.txt
          cat all-results/candidate-dotnet-info.txt

          CANDIDATE_VERSION=$("$CANDIDATE_ROOT/dotnet" --list-runtimes |
            awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^11[.]0[.]/ { print $2 }')
          test -n "$CANDIDATE_VERSION"
          test "$CANDIDATE_VERSION" != "11.0.0-rc.2.26504.105"
          test "$(printf '%s\n' "$CANDIDATE_VERSION" | wc -l | tr -d ' ')" = 1
          cat "$CANDIDATE_ROOT/shared/Microsoft.NETCore.App/$CANDIDATE_VERSION/.version" |
            tee all-results/candidate-runtime-version.txt
          cat "$DOTNET_ROOT/shared/Microsoft.NETCore.App/11.0.0-rc.2.26504.105/.version" |
            tee all-results/baseline-runtime-version.txt
          # These exact VMR sources were inspected before dispatch: candidate contains the
          # stopped-child fallback; baseline retains the unreaped-child loop.
          # https://github.com/dotnet/dotnet/blob/fba04ffe869680486931c78fd815b3f694087f91/src/runtime/src/libraries/System.Diagnostics.Process/src/System/Diagnostics/ProcessWaitState.Unix.cs
          # https://github.com/dotnet/dotnet/blob/820230c386db5b0106c5430b3e5aee92a7826bf5/src/runtime/src/libraries/System.Diagnostics.Process/src/System/Diagnostics/ProcessWaitState.Unix.cs
          test "$(head -n 1 all-results/candidate-runtime-version.txt | tr -d '\r')" = "fba04ffe869680486931c78fd815b3f694087f91"
          test "$(head -n 1 all-results/baseline-runtime-version.txt | tr -d '\r')" = "820230c386db5b0106c5430b3e5aee92a7826bf5"
          test "$CANDIDATE_VERSION" = "11.0.0"
          echo "CANDIDATE_DOTNET_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "CANDIDATE_RUNTIME_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"

          # Preserve the net10 runtime used by child fixtures; only the net11 host is varied.
          for framework in Microsoft.NETCore.App Microsoft.AspNetCore.App; do
            for version in "$DOTNET_ROOT/shared/$framework"/10.*; do
              if [ -d "$version" ]; then
                mkdir -p "$CANDIDATE_ROOT/shared/$framework"
                cp -R "$version" "$CANDIDATE_ROOT/shared/$framework/"
              fi
            done
          done
          "$DOTNET_ROOT/dotnet" msbuild "$TEST_PROJECT_PATH" \
            -getProperty:TargetPath -getProperty:MtpBaseArgs > all-results/test-properties.json

      - name: Run test iterations (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          ASPIRE_CLI_NUGET_SERVICE_INDEX: https://packagefeedproxy.microsoft.io/nuget/v3/index.json
          ASPIRE_CI_RUNTIME_COMPARISON: "true"
          # The explicit comparison filter retains all regular-suite exclusions.
          SkipDefaultTestFilters: true
        run: |
          set -euo pipefail
          PASS=0
          FAIL=0
          ITERATIONS=${{ env.ITERATIONS_PER_RUNNER }}

          TEST_DLL=$(jq -r '.Properties.TargetPath' all-results/test-properties.json)
          MTP_ARGS=$(jq -r '.Properties.MtpBaseArgs' all-results/test-properties.json)
          test -f "$TEST_DLL"
          test -n "$MTP_ARGS"
          # Keep repository timeouts, but collect stacks rather than active-test names alone.
          MTP_ARGS="${MTP_ARGS/--hangdump-type none/--hangdump-type mini}"
          ORDER="baseline candidate"
          if [ $(( ${{ matrix.index }} % 2 )) -eq 1 ]; then
            ORDER="candidate baseline"
          fi

          for mode in $ORDER; do
            for i in $(seq 1 "$ITERATIONS"); do
              echo "::group::$mode iteration $i/$ITERATIONS"
              RESULTS="${{ github.workspace }}/all-results/$mode-$i"
              mkdir -p "$RESULTS"
              ROOT="${{ github.workspace }}/.dotnet"
              VERSION="11.0.0-rc.2.26504.105"
              COMMIT="820230c386db5b0106c5430b3e5aee92a7826bf5"
              if [ "$mode" = candidate ]; then
                ROOT="$CANDIDATE_DOTNET_ROOT"
                VERSION="$CANDIDATE_RUNTIME_VERSION"
                COMMIT="fba04ffe869680486931c78fd815b3f694087f91"
              fi

              START=$SECONDS
              set +e
              DOTNET_ROOT="$ROOT" DOTNET_ROOT_ARM64="$ROOT" \
                "$ROOT/dotnet" exec --fx-version "$VERSION" "$TEST_DLL" \
                $MTP_ARGS \
                --results-directory "$RESULTS" \
                --report-trx --report-trx-filename Cli.trx \
                ${{ env.TEST_FILTER }} \
                2>&1 | tee "$RESULTS/console.log"
              RESULT=${PIPESTATUS[0]}
              set -e
              echo "$RESULT" > "$RESULTS/testhost-exit-code.txt"
              echo "$((SECONDS - START))" > "$RESULTS/duration-seconds.txt"

              if [ "$RESULT" -eq 0 ] &&
                ! grep -qiE "total:\s*[1-9]" "$RESULTS/console.log"; then
                echo "::error::$mode iteration $i: Zero tests executed."
                RESULT=8
              fi
              EXPECTED_IDENTITY="RUNTIME_COMPARISON framework=.NET $VERSION processAssembly=$ROOT/shared/Microsoft.NETCore.App/$VERSION/System.Diagnostics.Process.dll processVersion=$VERSION+$COMMIT"
              if ! grep -Fxq "$EXPECTED_IDENTITY" "$RESULTS/console.log"; then
                echo "::error::$mode iteration $i: Loaded test-host runtime/Process assembly identity did not match verified source."
                RESULT=1
              fi
              echo "$RESULT" > "$RESULTS/exit-code.txt"
              if [ "$RESULT" -eq 0 ]; then
                PASS=$((PASS + 1))
              else
                FAIL=$((FAIL + 1))
              fi
              echo "runtime=$mode iteration=$i exit=$RESULT" | tee -a all-results/comparison-summary.txt

              echo "::endgroup::"
            done
          done

          echo ""
          echo "========================================"
          echo "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          echo "  Passed: $PASS / $((2 * ITERATIONS))"
          echo "  Failed: $FAIL / $((2 * ITERATIONS))"
          echo "========================================"

          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Run test iterations (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
        run: |
          $pass = 0
          $fail = 0
          $iterations = [int]"${{ env.ITERATIONS_PER_RUNNER }}"

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "::group::Iteration $i/$iterations"

            # Cleanup between iterations
            Remove-Item -Recurse -Force "${{ github.workspace }}/testresults" -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match '^dcp' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1

            # Run test (capture output for zero-test detection)
            $iterOutput = Join-Path "${{ github.workspace }}" "iter-output-$i.log"
            & ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" `
              --no-restore `
              --no-build `
              -- `
              --timeout 10m `
              --results-directory "${{ github.workspace }}/testresults" `
              ${{ env.TEST_FILTER }} *> $iterOutput
            $result = $LASTEXITCODE
            Get-Content $iterOutput

            # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
            if ($result -eq 0) {
              $content = Get-Content $iterOutput -Raw -ErrorAction SilentlyContinue
              if (-not ($content -match '(?i)total:\s*[1-9]')) {
                Write-Host "::error::Iteration ${i}: Zero tests executed. Verify TEST_FILTER and quarantine settings."
                $result = 8
              }
            }
            Remove-Item $iterOutput -ErrorAction SilentlyContinue

            if ($result -eq 0) {
              Write-Host "✅ Iteration ${i}: PASS"
              $pass++
            } else {
              Write-Host "❌ Iteration ${i}: FAIL (exit $result)"
              $fail++
              $dest = "${{ github.workspace }}/all-results/failure-$i"
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              Copy-Item -Recurse "${{ github.workspace }}/testresults/*" $dest -ErrorAction SilentlyContinue
            }

            Write-Host "::endgroup::"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          Write-Host "  Passed: $pass / $iterations"
          Write-Host "  Failed: $fail / $iterations"
          Write-Host "========================================"

          if ($fail -gt 0) { exit 1 }

      - name: Upload runtime comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.os }}-${{ matrix.index }}
          path: all-results/
          if-no-files-found: ignore

  results:
    if: ${{ always() && github.repository == 'microsoft/aspire' }}
    runs-on: ubuntu-latest
    name: Reproduce Results
    needs: [reproduce]
    permissions: {}
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "## Reproduce Flaky Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Project | \`${{ env.TEST_PROJECT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Filter | \`${{ env.TEST_FILTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| OSes | ${{ env.TARGET_OSES }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runners per OS | ${{ env.RUNNERS_PER_OS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Iterations per runner | ${{ env.ITERATIONS_PER_RUNNER }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.reproduce.result }}" = "success" ]; then
            echo "### ✅ All iterations passed on all runners" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.reproduce.result }}" = "failure" ]; then
            echo "### ❌ Some runners reported failures" >> $GITHUB_STEP_SUMMARY
            echo "Check individual job logs and uploaded failure artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Reproduce job was ${{ needs.reproduce.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if reproduce did not succeed
        if: ${{ needs.reproduce.result != 'success' }}
        run: exit 1
