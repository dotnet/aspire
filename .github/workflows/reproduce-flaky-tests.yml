name: Branch-only built-in-token permission probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attempt the worker's workflow-changing branch publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo;
            if (`${owner}/${repo}` !== "microsoft/aspire") throw new Error("Wrong repository");
            const reference = `refs/heads/ankj/flaky-investigation-token-worker-${context.runId}`;
            const main = await github.rest.git.getRef({owner, repo, ref: "heads/main"});
            const parent = main.data.object.sha;
            const commit = await github.rest.git.getCommit({owner, repo, commit_sha: parent});
            const path = ".github/workflows/reproduce-flaky-tests.yml";
            const original = await github.rest.repos.getContent({owner, repo, path, ref: parent});
            if (Array.isArray(original.data) || original.data.type !== "file") throw new Error("No workflow file");
            const content = Buffer.from(original.data.content, "base64").toString("utf8")
              + "\n# Branch-only GITHUB_TOKEN workflow-write capability probe.\n";
            const tree = await github.rest.git.createTree({owner, repo, base_tree: commit.data.tree.sha,
              tree: [{path, mode: "100644", type: "blob", content}]});
            const candidate = await github.rest.git.createCommit({owner, repo, tree: tree.data.sha,
              parents: [parent], message: "test(ci): probe built-in-token workflow branch publication\n\n"
              + "Change only a workflow comment on an isolated validation ref. Do not change main.\n\n"
              + "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"});
            const receipt = {token_source: "github.token", parent, candidate: candidate.data.sha,
              reference, changed_paths: [path], run_id: context.runId, published: false};
            try {
              const published = await github.rest.git.createRef({owner, repo, ref: reference,
                sha: candidate.data.sha});
              receipt.published = published.data.object.sha === candidate.data.sha;
              if (!receipt.published) throw new Error("Published ref mismatch");
            } catch (error) {
              receipt.error = {status: error.status, message: error.message};
              fs.writeFileSync("/tmp/flaky-token-capability.json", JSON.stringify(receipt, null, 2));
              throw error;
            }
            const mainAfter = await github.rest.git.getRef({owner, repo, ref: "heads/main"});
            receipt.main_after = mainAfter.data.object.sha;
            fs.writeFileSync("/tmp/flaky-token-capability.json", JSON.stringify(receipt, null, 2));
            core.info(JSON.stringify(receipt));
      - name: Retain the actual permission result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-in-token-workflow-write-capability
          path: /tmp/flaky-token-capability.json
          if-no-files-found: error
