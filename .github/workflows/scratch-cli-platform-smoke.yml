name: CI wall-time validation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

run-name: "CI wall-time validation (${{ github.ref_name }})"

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    with:
      versionOverrideArg: /p:VersionSuffix=ci.walltime /p:DotNetFinalVersionKind=prerelease
      extensionVersionOverride: '99.0.21015'
