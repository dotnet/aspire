name: Scratch extension conditional propagation (intentional failure)
run-name: STUB extension condition probe - ${{ inputs.scenario }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Controlled failure; overall run must be red and assertions green
        required: true
        type: choice
        options:
          - linux-bootstrap-fails
          - preflight-fails

permissions:
  contents: read

jobs:
  tests:
    name: STUB Tests
    uses: ./.github/workflows/scratch-extension-conditions.yml
    with:
      scenario: ${{ inputs.scenario }}
