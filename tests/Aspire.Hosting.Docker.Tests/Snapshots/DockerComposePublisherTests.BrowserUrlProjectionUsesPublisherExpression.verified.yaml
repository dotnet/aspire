services:
  env-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  frontend:
    image: "nginx:alpine"
    expose:
      - "8080"
    networks:
      - "aspire"
  backend:
    image: "nginx:alpine"
    environment:
      ORIGIN: "https://${PUBLIC_HOST}"
      CONFIG: "origin=https://${PUBLIC_HOST}"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
