---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "backend-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "backend"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ORIGIN: "https://{{ .Values.config.backend.public_host }}"
  CONFIG: "origin=https://{{ .Values.config.backend.public_host }}"
